apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: thpack
      defaultBucket: telemetry
    secureJsonData:
      token: thpack-telemetry-token-123

  - name: MySQL_THPack
    type: mysql
    access: proxy
    url: mysql:3306
    database: thpack_dashboard
    user: thpack_user
    jsonData:
      maxOpenConns: 100
      maxIdleConns: 100
      connMaxLifetime: 14400
    secureJsonData:
      password: thpack_pass123
